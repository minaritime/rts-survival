# main 에 올릴 때마다 점검하고 빌드해서 GitHub Pages 에 배포합니다.
# 서버가 할 일이 없는 브라우저 게임이라 정적 호스팅 하나로 끝납니다.
# 그림(public/assets)은 Blender 없이도 돌도록 저장소에 같이 올려 두었습니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것 하나만. 올리는 도중에 끊기지 않게 진행 중인 것은 취소하지 않음
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 타입 검사 + 규칙 테스트가 통과해야 올라갑니다 (깨진 판이 주소에 걸리지 않게)
      - run: npm run check

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
